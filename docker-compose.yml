version: '3.8'

services:
  minimal-api-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: minimal-api-project:latest
    container_name: minimal-api-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_HOST=${DB_HOST:-localhost}
      - DB_NAME=${DB_NAME:-minimalapi}
      - DB_USER=${DB_USER:-dbuser}
      - DB_PASSWORD=${DB_PASSWORD:-dbpassword}
    volumes:
      - ./logs:/app/logs
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge